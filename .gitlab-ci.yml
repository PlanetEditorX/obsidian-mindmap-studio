image: node:22

stages:
  - verify

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run verify
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - main.js
      - manifest.json
      - styles.css

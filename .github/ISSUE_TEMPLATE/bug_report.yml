name: Bug 报告
description: 报告可复现的功能、数据或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 1.19.2
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian 与操作系统
      placeholder: Obsidian 1.x / Windows、macOS、Linux、iOS 或 Android
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用不含私人内容的最小示例。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 删除令牌、路径和个人内容后再粘贴日志。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 数据安全
      options:
        - label: 我已移除图床令牌、私人导图和仓库路径
          required: true
